name: Beam Pages
on:
  pull_request:
  push:
    branches: ["**"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: beam-pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.3'
          package-manager-cache: false
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build && npm run test:unit && npm run test:flow
      - id: visual
        run: npm run test:visual
      # Keep failures visible. Capture runner-native evidence only on review branches.
      - if: failure() && steps.visual.outcome == 'failure' && (github.event_name == 'pull_request' || github.ref != 'refs/heads/main')
        run: npm run test:visual -- --update-snapshots=all --output=test-results/visual-candidate
      - if: failure() && steps.visual.outcome == 'failure' && (github.event_name == 'pull_request' || github.ref != 'refs/heads/main')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: beam-visual-review
          path: tests/browser/snapshots/linux-x64
          if-no-files-found: error
          retention-days: 2
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist
  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.release.outputs.page_url }}
    steps:
      - id: release
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
