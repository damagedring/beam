<!doctype html>
<html lang="ko">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width, initial-scale=1">
 <meta name="referrer" content="no-referrer">
 <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' https://accounts.google.com/gsi/style; frame-src https://accounts.google.com/gsi/; connect-src https://accounts.google.com/gsi/ https://www.googleapis.com/upload/drive/v3/files; img-src data:; form-action 'none'; base-uri 'none'; object-src 'none'">
 <title>Beam · Google Drive</title>
 <link rel="stylesheet" href="./export.css">
 <script type="module" src="./export.mjs"></script>
</head>
<body data-app-origin="" data-oauth-client-id="" data-picker-api-key="" data-picker-project="">
 <main>
  <p class="eyebrow">BEAM / EXPORT</p>
  <h1>Google Drive 저장</h1>
  <p>검수 기록 JSON 한 개를 선택한 Google 계정의 지정한 위치에 새로 만듭니다. 기준 RAW, 고객명 조회 목록, 파일 출처는 포함하지 않아요.</p>
  <p>기록에는 오더 번호, 상품 코드, 수량, 작업 시각 등 작업 식별 정보가 들어갈 수 있어요. 회사 자료라면 이 계정에 저장해도 되는지 먼저 확인하세요.</p>
  <p id="status" role="status" aria-live="polite">Beam의 작업 기록을 확인하는 중…</p>
  <fieldset id="destination-choices" hidden>
   <legend>저장 위치</legend>
   <label><input type="radio" name="destination" value="root" checked> 내 드라이브 최상위</label>
   <label><input type="radio" name="destination" value="folder"> 초대받은 폴더 또는 공유 드라이브 폴더 선택</label>
  </fieldset>
  <section id="folder-confirmation" hidden aria-label="선택한 폴더 확인">
   <p>저장할 폴더: <strong id="folder-name"></strong></p>
   <p>새 파일은 이 폴더의 공유 설정을 따를 수 있어요.</p>
   <button id="write-folder" type="button">이 폴더에 저장</button>
  </section>
  <div class="actions">
   <button id="authorize" type="button" disabled>Google 계정 선택 후 저장</button>
   <button id="cancel" type="button">취소</button>
  </div>
  <p><a id="open-result" hidden target="_blank" rel="noopener noreferrer">저장된 파일 열기</a></p>
 </main>
</body>
</html>
